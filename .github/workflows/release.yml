name: Release

# Versions and publishes the packages under packages/ in three jobs with separate privileges.
#
# - "version" opens or updates the "chore: version packages" PR while changesets are pending.
#   It holds no npm credentials, and its GITHUB_TOKEN can only read. It writes with a GitHub App token, which it requires,
#   so that CI runs on that PR.
# - "build" runs when no changesets are pending, i.e. after that PR is merged. It installs without
#   lifecycle scripts, tests, builds and packs tarballs for versions that are not released yet (not on npm, or on npm
#   without a release tag after a partial run), and uploads them.
#   It has read-only repository access and no id-token, so nothing it runs can publish.
# - "publish" runs in the `npm` environment, downloads the tarballs and publishes exactly those through npm
#   trusted publishing (OIDC), tagging each as soon as it is on npm: no long-lived npm token exists. It runs no
#   repository code and installs nothing. A rerun skips versions already on npm with the same tarball and still tags them.
#   npm adds provenance automatically for a public repository.
#
# The trusted publisher on npmjs.com is bound to this exact file name and to the environment `npm`,
# so do not rename either. See packages/sdk/README.md for the one-off first publish.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".changeset/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "scripts/**"
      - ".github/workflows/release.yml"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  version:
    if: github.repository == 'drophawk-net/drophawk-js'
    runs-on: ubuntu-latest
    # The `release` environment (restricted to main) holds the GitHub App credentials:
    #   variable DROPHAWK_JS_RELEASE_CLIENT_ID, secret DROPHAWK_JS_RELEASE_PRIVATE_KEY.
    environment: release
    # GITHUB_TOKEN only reads. Every write (the version branch, its commit and the pull request) is made with the
    # release App's token below, and the job fails if the App is not configured.
    permissions:
      contents: read
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require the release App
        env:
          CLIENT_ID: ${{ vars.DROPHAWK_JS_RELEASE_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.DROPHAWK_JS_RELEASE_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$CLIENT_ID" ] || missing+=("variable DROPHAWK_JS_RELEASE_CLIENT_ID")
          [ -n "$PRIVATE_KEY" ] || missing+=("secret DROPHAWK_JS_RELEASE_PRIVATE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Release App not configured::The 'release' environment is missing: ${missing[*]}. The version job writes only with the release GitHub App's token and has no GITHUB_TOKEN fallback. Configure the App as described in the README."
            exit 1
          fi

      # The App token pushes the version commit and opens the PR. A pull request opened with GITHUB_TOKEN would not trigger CI;
      # this one does. The token is scoped to this repository and expires with the job.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DROPHAWK_JS_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.DROPHAWK_JS_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # changesets/action pushes through the GitHub API with `github-token`, and hands the same token to the version script
      # as GITHUB_TOKEN, where changelog-github uses it to look up PR and author links. It refuses to run if a GITHUB_TOKEN
      # environment variable that differs from the input is set, so none is set here.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: bun run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  build:
    needs: version
    if: github.repository == 'drophawk-net/drophawk-js' && needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-tarballs: ${{ steps.pack.outputs.has-tarballs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # pack-unpublished.ts also packs a version that is on npm but has no release tag, so publish can tag it.
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test
        run: |
          bun run --filter @drophawk/sdk typecheck
          bun run --filter @drophawk/sdk test
          bun run --filter @drophawk/sdk build
          bun run --filter @drophawk/mcp typecheck
          bun run --filter @drophawk/mcp test

      # Fails this job until the repository has a LICENSE and every package.json a `license` field.
      # Also copies LICENSE into each package directory, then rewrites `workspace:` ranges for the tarballs.
      - id: pack
        name: Pack tarballs for versions not yet released
        run: |
          bun scripts/prepare-publish.ts
          bun run --filter @drophawk/sdk build
          bun run --filter @drophawk/mcp build
          bun scripts/resolve-workspace-deps.ts
          bun scripts/pack-unpublished.ts release-tarballs

      - name: Upload tarballs
        if: steps.pack.outputs.has-tarballs == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs
          path: release-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'drophawk-net/drophawk-js' && needs.build.outputs.has-tarballs == 'true'
    runs-on: ubuntu-latest
    # The npm trusted publisher is configured for this environment name.
    environment: npm
    permissions:
      contents: write # push release tags
      id-token: write # npm trusted publishing
    steps:
      # Only for the commit to tag. No repository script runs in this job, and nothing is installed.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: release-tarballs

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14. setup-node v7
      # does not export a dummy NODE_AUTH_TOKEN, which would stop npm from using OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Each version is published and then tagged at once, so a partial success is durable: when a later tarball fails,
      # the earlier ones are already on npm and tagged. On a rerun, a version already on npm with exactly this tarball's
      # integrity is not published again but is still tagged; one on npm with different contents fails the job, because
      # it cannot be republished and tagging this commit would be wrong. The token lives only in this step's environment,
      # as a one-off request header for git. No credential is persisted in .git/config.
      - name: Publish and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          failed=0
          for tarball in release-tarballs/*.tgz; do
            # shellcheck disable=SC2016 # the backticks are a JavaScript template literal for node, not shell
            id="$(tar -xzOf "$tarball" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); `${p.name}@${p.version}`')"
            integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
            # An unknown version of a known package prints nothing; an unknown package is E404. Anything else is a real failure.
            if ! published="$(npm view "$id" dist.integrity 2> npm-view.err)"; then
              if grep -qE 'E404|404 Not Found' npm-view.err; then
                published=""
              else
                cat npm-view.err
                echo "::error title=npm lookup failed::Could not look up $id on the npm registry."
                exit 1
              fi
            fi
            if [ -z "$published" ]; then
              echo "Publishing $id from $tarball"
              npm publish "$tarball" --access public
            elif [ "$published" = "$integrity" ]; then
              echo "$id is already on npm with this exact tarball; not publishing it again"
            else
              echo "::error title=$id already published::$id is on npm with different contents ($published, this build is $integrity). It cannot be republished; tag the commit it was published from by hand."
              failed=1
              continue
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$id" > /dev/null; then
              echo "Tag $id already exists"
            else
              git tag "$id" "$GITHUB_SHA"
              git push origin "refs/tags/$id"
            fi
          done
          exit "$failed"
