name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generated types are up to date
        working-directory: packages/sdk
        run: bun run generate -- --check

      - name: MCP catalogue limits are up to date
        working-directory: packages/mcp
        run: bun run generate -- --check

      - name: Type check
        run: bun run --filter @drophawk/sdk typecheck

      - name: Test
        run: bun run --filter @drophawk/sdk test

      - name: Build
        run: bun run --filter @drophawk/sdk build

      - name: Package contents
        working-directory: packages/sdk
        run: npm pack --dry-run

      # @drophawk/mcp builds against the SDK's dist, so it comes after the SDK build.
      - name: MCP server type check
        run: bun run --filter @drophawk/mcp typecheck

      # Builds first, then includes an end-to-end test that spawns dist/bin.js over stdio.
      - name: MCP server test
        run: bun run --filter @drophawk/mcp test

      # The release job rewrites `workspace:` ranges before publishing; check that what npm would pack
      # has none left, so the published package installs. The rewrite stays in this CI checkout only.
      - name: MCP server package has no workspace ranges
        working-directory: packages/mcp
        run: |
          bun ../../scripts/resolve-workspace-deps.ts
          npm pack --dry-run
          npm pack --pack-destination "$RUNNER_TEMP" --silent
          packed="$(tar -xzOf "$RUNNER_TEMP"/drophawk-mcp-*.tgz package/package.json)"
          echo "$packed" | grep -A4 '"dependencies"'
          if echo "$packed" | grep -q 'workspace:'; then
            echo "::error::the packed package.json still contains a workspace: range"
            exit 1
          fi

  # The spec-regenerate scripts guard the workflow that pushes with the release App's token; test them against
  # hostile fixtures and lint every workflow. actionlint and shellcheck are pinned releases checked by SHA-256.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the spec-regenerate scripts
        run: .github/scripts/spec-regenerate/test.sh

      - name: Install actionlint and shellcheck
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$bin" actionlint
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Lint workflows and scripts
        run: |
          actionlint
          shellcheck .github/scripts/spec-regenerate/*.sh
